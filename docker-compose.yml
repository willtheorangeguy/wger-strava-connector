name: wger-strava-connector
services:
  connector:
    image: ${CONNECTOR_IMAGE:-ghcr.io/willtheorangeguy/wger-strava-connector}:${CONNECTOR_VERSION:-0.2.1}
    env_file: .env
    # Run continuously beside the main service and export new eligible workouts.
    command: [watch]
    init: true
    restart: unless-stopped
    extra_hosts: ['host.docker.internal:host-gateway']
    volumes: ['state:/data']
volumes:
  state:
