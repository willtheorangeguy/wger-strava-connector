name: Connector tests
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock && pip install --no-deps .
      - run: pytest -q -m 'not integration' --junitxml=reports/unit.xml
      - name: Validate deployment examples
        env:
          STRAVA_CONNECTOR_PATH: ${{ github.workspace }}
          STRAVA_WGER_TOKEN: mock-token
          STRAVA_CLIENT_ID: mock-client
          STRAVA_CLIENT_SECRET: mock-secret
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f examples/docker-compose.wger.yml config --quiet
      - name: Build and smoke-test container
        run: |
          docker build --tag wger-strava-connector:ci .
          docker run --rm wger-strava-connector:ci --help
          test "$(docker run --rm --entrypoint id wger-strava-connector:ci -u)" = 10001
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-reports
          path: reports/
  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wger-strava-connector
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: willtheorangeguy/wger-addon-harness
          path: wger-addon-harness
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python test_harness.py
        working-directory: wger-strava-connector
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-reports
          path: wger-strava-connector/reports/
