# Place beside your existing wger Compose file; no connector checkout is needed.
# The overlay assumes wger's web service is on the default network.
services:
  strava-connector:
    image: ${STRAVA_CONNECTOR_IMAGE:-ghcr.io/willtheorangeguy/wger-strava-connector}:${STRAVA_CONNECTOR_VERSION:-0.2.1}
    environment:
      WGER_BASE_URL: ${STRAVA_WGER_BASE_URL:-http://web:8000}
      WGER_TOKEN: ${STRAVA_WGER_TOKEN:?Set STRAVA_WGER_TOKEN}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:?Set STRAVA_CLIENT_ID}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:?Set STRAVA_CLIENT_SECRET}
      WORKOUT_TIMEZONE: ${STRAVA_WORKOUT_TIMEZONE:-UTC}
      EXPORT_SINCE: ${STRAVA_EXPORT_SINCE:-}
      SYNC_INTERVAL_SECONDS: ${STRAVA_SYNC_INTERVAL_SECONDS:-900}
      SETTLE_SECONDS: ${STRAVA_SETTLE_SECONDS:-300}
      MAX_UPLOADS_PER_SYNC: ${STRAVA_MAX_UPLOADS_PER_SYNC:-10}
    init: true
    restart: unless-stopped
    volumes: ['strava_connector_state:/data']
volumes:
  strava_connector_state:
